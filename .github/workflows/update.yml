name: Weekly AI Feed Update

on:
  schedule:
    - cron: '0 0 * * 0' # Runs at midnight every Sunday
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      start_date:
        description: 'Start Date (YYYY/MM/DD). Leave blank for default 7 days.'
        required: false
name: Weekly AI Feed Update

on:
  schedule:
    - cron: '0 0 * * 0' # Runs at midnight every Sunday
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      start_date:
        description: 'Start Date (YYYY/MM/DD). Leave blank for default 7 days.'
        required: false
        type: string
      end_date:
        description: 'End Date (YYYY/MM/DD). Leave blank for default 7 days.'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run AI update script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python scripts/update_feed.py
        
      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Update weekly feed via AI" && git push)

  deploy:
    needs: update-feed
    uses: ./.github/workflows/deploy.yml
